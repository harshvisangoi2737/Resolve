<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Resolv</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/signup.css">
</head>

<body>

  <canvas id="bg-canvas"></canvas>

  <!-- NAVBAR -->
  <nav>
    <div class="nav-logo">Re<span>solv</span></div>
    <ul class="nav-links">
      <li><a onclick="goTo('index')">Home</a></li>
      <li><a onclick="goTo('dashboard')">Dashboard</a></li>
      <li><a onclick="goTo('complaint')">File Complaint</a></li>
      <li><a onclick="goTo('track')">Track</a></li>
      <li><a onclick="goTo('analytics')">Analytics</a></li>
      <!-- <li><a onclick="goTo('admin')">Admin</a></li> -->
    </ul>
    <button class="nav-cta" onclick="goTo('complaint')">File a Complaint</button>
  </nav>

  <!-- ===================== SIGNUP PAGE ===================== -->
  <div id="page-signup" class="page active">
    <div class="login-wrapper">
      <div class="login-card signup-card">
        <div class="login-title">Re<span>solv</span></div>
        <p class="login-sub">Create an account to file and track hostel complaints.</p>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" placeholder="Your full name" id="signup-name">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Student ID</label>
            <input type="text" class="form-input" placeholder="e.g. 2023CS042" id="signup-id">
          </div>
          <div class="form-group">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-input" placeholder="10-digit number" id="signup-phone">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" placeholder="you@college.edu" id="signup-email">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Create a password" id="signup-password">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" placeholder="Re-enter password" id="signup-confirm">
          </div>
        </div>



        <div id="signup-error" class="login-error" style="display:none;"></div>

        <button class="btn-primary login-btn" onclick="handleSignup()">Create Account →</button>

        <p class="login-footer-text">
          Already have an account? <a onclick="goTo('login')">Log in</a>
        </p>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast">
    <span id="toast-icon">✅</span>
    <span id="toast-msg">Done!</span>
  </div>

  <script src="js/shared.js"></script>
  <script src="js/signup.js"></script>
</body>

</html>
